<header class="app-header">
  
  <div class="header-main">
    
    <div class="logo-container">
      <h2>MiTienda</h2>
    </div>

    <div class="search-container">
      <input 
        type="text" 
        placeholder="Buscar productos..." 
        #searchInput 
        (keyup.enter)="onSearch(searchInput.value)"
      />
      <button (click)="onSearch(searchInput.value)">Buscar</button>
    </div>

    <div class="quick-links">
      <a routerLink="/lo-mas-vendido" class="bestsellers-link">Lo más vendido</a>
    </div>

    <div class="user-actions">
      <button class="icon-btn profile-btn" title="Perfil">
        <i class="icon-user"></i> Perfil
      </button>
      
      <button class="icon-btn cart-btn" title="Carrito de Compras">
        <i class="icon-cart"></i> Compra ({{ cartItemCount }})
      </button>
    </div>

  </div>

  <div class="header-navbar-container">
    <ng-content select="[navbar]"></ng-content>
    
    <span class="placeholder-text">Espacio reservado para el Navbar</span>
  </div>

</header>
