<header class="header">
  <div class="header__container">
    <div class="header__brand">
      <a routerLink="/" class="header__logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
        </svg>
        <span class="header__title">Biblioteca</span>
      </a>
    </div>

    <div class="header__search">
      <input type="text" class="header__search-input" placeholder="Buscar libros, autores..." #searchInput (keyup.enter)="onSearch(searchInput.value)">
      <button class="header__search-btn" (click)="onSearch(searchInput.value)">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
    </div>

    <nav class="header__nav">
      <ul class="header__nav-list">
        <li><a routerLink="/catalogo" class="header__nav-link">Catálogo</a></li>
        <li><a routerLink="/novedades" class="header__nav-link">Novedades</a></li>
        <li><a routerLink="/contacto" class="header__nav-link">Contacto</a></li>
      </ul>
    </nav>

    <div class="header__actions">
      <button class="header__btn header__btn--login" routerLink="/auth/login">Iniciar Sesión</button>
      <button class="header__btn header__btn--register" routerLink="/auth/register">Registrarse</button>
    </div>
  </div>
</header>
