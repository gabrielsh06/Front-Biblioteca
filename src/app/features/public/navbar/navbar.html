<header class="site-header">
    <div class="site-header__bar">
        <a class="site-header__brand" routerLink="/" aria-label="Biblioteca Abierta, inicio">
            <span class="site-header__logo" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                    <path
                        fill="currentColor"
                        d="M96 128C96 92.7 124.7 64 160 64L288 64L288 576L160 576C124.7 576 96 547.3 96 512L96 128zM352 64L480 64C515.3 64 544 92.7 544 128L544 512C544 547.3 515.3 576 480 576L352 576L352 64z"
                    />
                </svg>
            </span>
            <span class="site-header__brand-copy">
                <strong class="site-header__title">Biblioteca <em>Abierta</em></strong>
                <small class="site-header__tagline">Red comunitaria de libros</small>
            </span>
        </a>

        <form class="site-header__search" role="search">
            <label class="visually-hidden" for="site-search">Buscar en el catálogo</label>
            <svg class="site-header__search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
                <path fill="currentColor" d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 0 0 0 288z" />
            </svg>
            <input id="site-search" class="site-header__search-input" type="search" name="q" placeholder="Buscar título, autor, ISBN..." />
        </form>

        <nav class="site-header__desktop-nav" aria-label="Navegación principal">
            @for (link of navLinks; track link.path) {
                <a class="site-header__link" [routerLink]="link.path" routerLinkActive="site-header__link--active">
                    {{ link.label }}
                </a>
            }
            <a class="site-header__donate" routerLink="/donar">Donar libro</a>
        </nav>

        <div class="site-header__actions">
            <button class="site-header__cart" type="button" aria-label="Carrito de libros">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" aria-hidden="true">
                    <path fill="currentColor" d="M0 24C0 10.7 10.7 0 24 0L69.5 0c22.4 0 42.1 15.5 47 37.1L122.3 64 512 64c35.3 0 64 28.7 64 64 0 7.1-1.2 14.2-3.5 20.9L527.6 304.6C518.2 331.6 492.8 352 464.2 352L176 352l9.6 48L464 400c13.3 0 24 10.7 24 24s-10.7 24-24 24L166.8 448c-23 0-42.8-16.4-47-39L76.1 76.6 24 76.6C10.7 76.6 0 65.9 0 52.6L0 24zM176 480a32 32 0 1 1 0 64 32 32 0 1 1 0-64zm256 32a32 32 0 1 1 64 0 32 32 0 1 1-64 0z" />
                </svg>
            </button>
            <a class="site-header__account" routerLink="/login">Cuenta</a>
            <details class="site-header__menu">
                <summary aria-label="Abrir menú de navegación">
                    <span></span><span></span><span></span>
                </summary>
                <div class="site-header__panel">
                    <form class="site-header__search site-header__search--panel" role="search">
                        <label class="visually-hidden" for="panel-search">Buscar en el catálogo</label>
                        <svg class="site-header__search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
                            <path fill="currentColor" d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 0 0 0 288z" />
                        </svg>
                        <input id="panel-search" class="site-header__search-input" type="search" name="q-panel" placeholder="Buscar título, autor, ISBN..." />
                    </form>
                    <nav class="site-header__panel-links" aria-label="Navegación del menú">
                        @for (link of navLinks; track link.path) {
                            <a class="site-header__link" [routerLink]="link.path">{{ link.label }}</a>
                        }
                        <a class="site-header__link" routerLink="/donar">Donar libro</a>
                        <a class="site-header__link" routerLink="/login">Cuenta</a>
                    </nav>
                </div>
            </details>
        </div>
    </div>
</header>
