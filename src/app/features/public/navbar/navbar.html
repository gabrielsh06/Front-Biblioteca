<header class="navbar">
    <div class="navbar__container">
        <a class="navbar__brand" routerLink="/" (click)="closeMobileMenu()">
            <span class="navbar__logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" aria-hidden="true">
                    <path
                        fill="currentColor"
                        d="M96 128C96 92.7 124.7 64 160 64L288 64L288 576L160 576C124.7 576 96 547.3 96 512L96 128zM352 64L480 64C515.3 64 544 92.7 544 128L544 512C544 547.3 515.3 576 480 576L352 576L352 64z"
                    />
                </svg>
            </span>
            <span class="navbar__brand-text">
                <span class="navbar__title">Biblioteca <em>Abierta</em></span>
                <span class="navbar__tagline">Red comunitaria de libros</span>
            </span>
        </a>
        <form class="navbar__search" role="search">
            <svg
                class="navbar__search-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 512 512"
                aria-hidden="true"
            >
                <path
                    fill="currentColor"
                    d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"
                />
            </svg>
            <input
                class="navbar__search-input"
                type="search"
                name="q"
                placeholder="Buscar título, autor, ISBN..."
                aria-label="Buscar en el catálogo"
            />
        </form>
    </div>
</header>
